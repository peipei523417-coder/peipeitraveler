name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Read app_config from Supabase REST API
        env:
          SUPABASE_URL: https://prnbldqlgslmqagnhpvu.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/app_config?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP Status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" -ne 200 ]; then
            echo "Keep-alive request failed."
            exit 1
          fi

          echo "Keep-alive request succeeded. Supabase project is active."
